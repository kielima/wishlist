name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Projeto Supabase consolidado — compartilhado com o app-produtividade,
          # com as tabelas da wishlist no schema `wishlist`.
          # A chave publicável é pública por definição: ela vai no bundle que o
          # GitHub Pages serve, e quem protege os dados é o RLS. Fica escrita aqui
          # em vez de numa Variable para a config do backend viver junto do código.
          VITE_SUPABASE_URL: https://robwqxgllzxbxwnjkyic.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ver9EeXJEKDvDGpY7TRACw_sVVY6aoF
