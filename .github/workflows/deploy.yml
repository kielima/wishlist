name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite um único deploy concorrente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Projeto Supabase consolidado — compartilhado com o app-produtividade,
          # com as tabelas da wishlist no schema `wishlist`.
          # A chave publicável é pública por definição: ela vai no bundle que o
          # GitHub Pages serve, e quem protege os dados é o RLS. Fica escrita aqui
          # em vez de numa Variable para a config do backend viver junto do código.
          VITE_SUPABASE_URL: https://robwqxgllzxbxwnjkyic.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ver9EeXJEKDvDGpY7TRACw_sVVY6aoF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
